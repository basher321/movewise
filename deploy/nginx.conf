# Nginx site for one domain (B12). Copy to /etc/nginx/sites-available/movewise, replace
# example.com with your domain, link it into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Get the certificate first (docs/INSTALL.md, step "HTTPS"): this file expects it to exist.

# Request rate limits per visitor IP (sign-in, sign-up, codes, and the contact form).
limit_req_zone $binary_remote_addr zone=movewise_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=movewise_enquiries:10m rate=5r/m;

# HTTP: only the Certbot challenge, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads and request bodies: the API refuses anything over 3 MB too.
    client_max_body_size 3m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=movewise_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/enquiries {
        limit_req zone=movewise_enquiries burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    # B21: agent and partner documents (agreements) may be up to 10 MB; only these two upload
    # addresses allow the larger body. The API checks the same limit.
    location ~ ^/api/admin/(agents|partners)/[^/]+/documents$ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
