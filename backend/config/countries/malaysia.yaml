# CV Agent country rules (spec B28). Edit freely; the server reads these files when it starts.
# photo / date_of_birth / marital_status / nationality: never | optional | common. Sections: summary, experience,
# education, skills, languages, certifications, training, achievements, references, custom.
country: Malaysia
document_name: Resume
spelling: en-GB
page_length_default: 2
photo: common
date_of_birth: optional
marital_status: optional
nationality: optional
gender: never
religion: never
required_sections:
- summary
- experience
- education
- skills
- languages
optional_sections:
- certifications
- training
- achievements
- references
- custom
section_order:
- summary
- experience
- education
- skills
- languages
- certifications
- training
- achievements
- references
- custom
date_format: MMM YYYY
notes: Malaysian employers often expect nationality and sometimes a photo. Keep personal details short
  and relevant.
