# CV Agent country rules (spec B28). Edit freely; the server reads these files when it starts.
# photo / date_of_birth / marital_status / nationality: never | optional | common. Sections: summary, experience,
# education, skills, languages, certifications, training, achievements, references, custom.
country: USA
document_name: Resume
spelling: en-US
page_length_default: 1
photo: never
date_of_birth: never
marital_status: never
nationality: never
gender: never
religion: never
required_sections:
- summary
- experience
- education
- skills
- languages
optional_sections:
- certifications
- training
- achievements
- references
- custom
section_order:
- summary
- experience
- education
- skills
- languages
- certifications
- training
- achievements
- references
- custom
date_format: MMM YYYY
notes: US resumes never include a photo, date of birth, marital status or nationality. One page is preferred
  for under 10 years of experience.
