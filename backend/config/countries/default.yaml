# CV Agent country rules (spec B28). Edit freely; the server reads these files when it starts.
# photo / date_of_birth / marital_status / nationality: never | optional | common. Sections: summary, experience,
# education, skills, languages, certifications, training, achievements, references, custom.
country: Other
document_name: CV
spelling: en-GB
page_length_default: 2
photo: never
date_of_birth: never
marital_status: never
nationality: never
gender: never
religion: never
required_sections:
- summary
- experience
- education
- skills
- languages
optional_sections:
- certifications
- training
- achievements
- references
- custom
section_order:
- summary
- experience
- education
- skills
- languages
- certifications
- training
- achievements
- references
- custom
date_format: MMM YYYY
notes: A clear two-page CV in British English. Personal details such as age or marital status are left
  out unless you turn them on.
